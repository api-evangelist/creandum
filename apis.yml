aid: creandum
name: Creandum
description: >-
  Creandum is a leading European early-stage venture capital firm founded in
  2003 by Staffan Helgesson and headquartered in Stockholm, Sweden, with
  additional offices in Berlin, London, and San Francisco. The firm backs
  founders building global, category-defining technology companies from seed to
  IPO and beyond, with its tagline "we back the companies of tomorrow before
  it's obvious." Creandum invests across software and SaaS, artificial
  intelligence, fintech, consumer, marketplaces, developer tools, and
  infrastructure, primarily across Europe with a growing US presence. Typical
  investment checks range from roughly $200K to $10M, and the firm manages
  around $2B in assets, having closed a €500M fund to back European early-stage
  startups. Its portfolio of 150+ companies includes some of Europe's most
  successful tech businesses such as Spotify, Klarna, Depop, Trade Republic,
  Pleo, Neo4j, iZettle, Bolt, Kry/Livi, Lovable, and Navan. This profile tracks
  Creandum's identity and its portfolio graph across the API Evangelist network.
